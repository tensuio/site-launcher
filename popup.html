<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: sans-serif;
        width: 240px;
        padding: 10px;
        background: #111;
        color: white;
      }

      h3 {
        margin: 0 0 10px;
        font-size: 14px;
        opacity: 0.7;
      }

      button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        margin: 6px 0;
        padding: 8px;
        border: none;
        background: #222;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        background: #333;
      }

      img {
        width: 16px;
        height: 16px;
      }
    </style>
  </head>
  <body>
    <h3>Quick Sites</h3>
    <div id="list"></div>

    <script src="sites.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
